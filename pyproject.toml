[project]
name = "careerops"
version = "0.1.0"
description = "Local human-in-the-loop job discovery and evaluation agent"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerops"]
