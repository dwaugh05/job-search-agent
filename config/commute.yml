# Door-to-door commute minutes from San Mateo 94403 (Hillsdale Caltrain area)
# at typical weekday morning traffic. Hand-curated on purpose: no API key, no
# quota, no network call in the hot path, and Doran can correct any number he
# disagrees with and immediately change how every future scan scores.
#
# Scoring thresholds live in scoring.yml (dimension 5), not here. This file only
# answers "how far is it".

