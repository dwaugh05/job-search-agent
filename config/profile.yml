# Who Doran is, what he will and won't take, and how he does offer math.
# Edit this file to change what the agent looks for. Weights live in scoring.yml.

identity:
  name: Doran Waugh
  email: dwaugh05@gmail.com
  location: San Mateo, CA 94403
  work_authorization: Authorized to work in the US for any employer
  most_recent: Senior AI Marketing Operations and Enablement, Cloudflare (May 2025 - May 2026)

# The role Doran is actually looking for, written out so the evaluator has a
# definition to reason against rather than a keyword list to pattern-match.
archetype:
  summary: >-
    AI enablement leadership inside a marketing or GTM organization. Owns the AI
    strategy for the marketing org, architects agentic workflows that take the
    groundwork off marketers while leaving strategy to humans, and upskills the
    org into power users who build medium-impact projects themselves under a
    dotted-line relationship. Blends three hats: builder, strategist, and
    enablement teacher.

  # Four real postings Doran rated highly, with four unrelated titles. This is
  # why matching runs on description content and never on job title.
  known_title_variants:
    - AI Marketing Technologist Lead
    - Director, AI GTM Strategy & Enablement
    - Manager, Marketing AI Enablement
    - Marketing Engineer
    - GTM Engineer
    - Marketing AI Lead
    - Head of AI Enablement
    - AI Enablement Manager
    - Marketing Technology Lead
    - AI Operations Lead

  strong_positive_signals:
    - Owns or defines the AI strategy for a marketing / GTM organization
    - Builds agentic workflows and internal AI tools for marketers
    - Trains, upskills, or enables non-technical marketing staff
    - Explicit human-in-the-loop framing (AI does groundwork, human keeps strategy)
    - Newly created role, greenfield, "first of its kind"
    - Exposure to VP-level or CMO-level stakeholders
    - Power-user / champion / dotted-line multiplication model
    - "Reaches across the funnel: demand gen, PMM, web, content, sales enablement"
    - Freedom to choose tooling
    - MCP, API integrations, prompt systems, workflow automation

  negative_signals:
    - Pure software engineering or ML engineering role
    - Requires production-grade CS fundamentals, distributed systems, or model training
    - Quota-carrying sales role
    - AI enablement that sits in IT / ITSM rather than marketing
    - Execution-only seat with no strategy component
    - AI used as branding with no budget, mandate, or real initiative
    - Heavy procurement red tape that blocks tool adoption

# Absolute deal-breakers. Checked before any scoring work happens.
hard_gates:
  # Broad scan only; targeted scan defaults to all-open.
  # Widened from 14 to 30 on 2026-08-12. The 14-day window was excluding real
  # matches: GitLab's "AI Transformation Owner, CRO" scored 4.84 -- second only
  # to the ceiling anchor -- and was dropped for being 21 days old. Roles in this
  # archetype are rare enough that a tight window costs more than it saves.
  #
  # Widened again 30 -> 60 on 2026-08-25, for the same reason and on measured
  # evidence: freshness is by far the largest rejection bucket (15,699 of 28,493
  # rejections, 55%), and re-running every other gate over those rejects found 49
  # postings in the 31-60 day band that cleared everything else -- Customer.io
  # "GTM AI Engineer", Vanta "Sr. AI GTM Engineer", Webflow "Staff Product
  # Manager, AI". Past 60 days the yield turns mostly to ghost postings, which is
  # also where evergreen_days below starts flagging them.
  freshness_days: 60
  # A posting we have personally been watching for longer than this, while its
  # feed still claims to be fresh, is flagged as evergreen or reposted -- not
  # rejected. Greenhouse's own published data puts 18-22% of postings in its ATS
  # in the ghost category, Ashby ships evergreen reqs as a documented feature,
  # and reposting resets the visible publish date. Our own first_seen is the
  # only date nobody can rewrite.
  evergreen_days: 75
  max_commute_minutes: 60         # door-to-door from 94403
  relocation_required: reject
  # Doran wants more leadership but not a VP seat -- that is over-reach, and the
  # JPMC anti-example fails here.
  reject_title_bands:
    - vp
    - vice president
    - svp
    - senior vice president
    - evp
    - chief
    - cmo
    - cto
    - ceo
    - coo
    - cro
    - president
    - board member
  # Tested against the TOP of a posted band, so wide ranges like Harvey's
  # $136k-$204k survive to be scored rather than being killed outright.
  min_base_salary_max: 150000

# Track B (growth marketing, the backup list) targets a narrower seniority band
# than track A: Senior Manager through Director, roles Doran clears comfortably
# rather than stretches into. He chose this deliberately on 2026-08-12.
#
# NOTE: this also excludes "Head of Growth" titles, which at a small startup are
# sometimes Director-scoped. Delete the two "head" entries below if you want
# those back.
track_overrides:
  growth_marketing:
    reject_title_bands:
      - vp
      - vice president
      - svp
      - senior vice president
      - evp
      - chief
      - cmo
      - cto
      - ceo
      - coo
      - cro
      - president
      - board member
      - head of
      - "head,"

compensation:
  target_tc_min: 200000
  target_tc_max: 300000
  base_floor: 170000
  assumed_bonus_rate: 0.10        # unless the posting states its own number
  equity_credit_low: 20000
  equity_credit_mid: 35000
  equity_credit_high: 50000
  # Score the realistic offer point for 10+ years of experience -- 70% up the
  # posted band -- not the midpoint.
  offer_point_in_band: 0.70
  ignore_benefits: true

location:
  home: San Mateo, CA 94403
  preferred_commute_minutes: 40
  remote_preferred: true
  # Doran will not leave the Bay Area.
  relocation: false
  acceptable_remote_scopes:
    - Remote - US
    - Remote - United States
    - Remote - Anywhere
    - Remote - CA
    - Remote - Bay Area

leadership:
  wants_direct_reports: false     # open to it, does not want it
  prefers_dotted_line: true
  max_title_band: director        # director or head is the ceiling he's comfortable with
  # Title itself is NOT a requirement -- see scoring.yml dimension 3. Doran said
  # plainly he does not get stuck on titles and stayed interested in an IC seat.
  title_is_soft_preference: true

review:
  min_score_to_present: 4.0
  max_results_per_report: 12
  # Roles scoring between this floor and the threshold get a one-line mention
  # under "Worth knowing about" rather than being dropped. Doran: "I still would
  # want to see this job and not completely filtered out... I don't want it
  # hidden from me completely." Hard-capped so it cannot become spray-and-pray.
  worth_knowing_floor: 3.7
  max_worth_knowing: 3

  # Three buckets, three bars. Doran, 2026-08-28, on how hard each should be to
  # get into: "be more lenient in the scoring to let more stuff slip in to the
  # cut line if it's in that bucket where it's AI plus marketing merged
  # together. And then be slightly less lenient when it's only AI. And then
  # don't really be too lenient at all in scoring when it's just pure
  # traditional marketing." On the size of it: "like a scale of 0, +1, +2."
  #
  # THIS IS A BAR, NOT A SCORE BONUS. Nothing here can move a score, so no
  # calibration anchor can drift because of it. Adding points to the buckets
  # instead would have moved every anchor at once.
  #
  # Sized against every score on record: a 0.15 step newly admits 11 postings
  # across the entire history (0.10 admits 6, 0.20 admits 15). A nudge, not a
  # shove, which is what he asked for.
  #
  # Overlap is 3.75 rather than 3.70 on purpose. worth_knowing_floor above is
  # 3.7, and the near-miss tier selects `score < bar AND score >= floor` -- so a
  # 3.70 bar would leave the overlap bucket with an empty near-miss band and
  # silently stop showing him the very roles he called his sweet spot.
  bucket_thresholds:
    overlap: 3.75          # AI + marketing, his sweet spot
    ai_only: 3.85          # AI enablement, strategy or builder
    marketing_only: 4.0    # traditional marketing, normal bar

# Applied postings the regression check should stop alarming about.
#
# `cli.py calibrate --applied-only` treats every job Doran applied to as a
# positive example and shouts REGRESSION if one would no longer reach scoring.
# That alarm is only useful while it means something, so a posting that is
# genuinely un-findable for a reason we have accepted belongs here rather than
# left ringing forever.
#
# This does NOT hide anything. An exempted posting is still listed on every run,
# marked KNOWN instead of BLOCKED, with its reason printed underneath. It simply
# stops counting as a failure.
#
# Add an entry only when the miss has been diagnosed and consciously accepted.
# Never add one to make a red check go green.
regression_exemptions:
  - url: https://www.google.com/about/careers/applications/jobs/results/124589741742924486-program-manager-ai-and-gemini-app-marketing
    added: 2026-08-28
    reason: >-
      Google posted this job twice, at two levels. Doran applied to the 5-year
      req ($136k-$196k), which scores 34.0 against the 40.0 relevance floor. Its
      3-year twin ($111k-$159k, id 106281886908588742) scores 48.5 and passes,
      so a scan DOES surface this role, just through the other advert. The gap
      is entirely that the senior description omits "agentic", "AI agent" and
      "AI-agentic", which its twin uses. Every other applied posting scores 45.5
      or higher (median 78), so this one is an unusually vague advert rather
      than a hole in the net. Two candidate fixes were measured and rejected on
      2026-08-28: scoring "automating manual work" and the verb "orchestrate"
      would have admitted 23 mostly off-archetype postings AND still left this
      one at 39.0. Doran: "if this one is a one off edge case, I don't want to
      try to do heavy work to our workflow just to fit this one specific job."

# How hard we are allowed to lean on other people's servers.
#
# Getting blocked by Greenhouse, Ashby or Lever would break this entire workflow,
# and the block would outlast the run that caused it. Doran, 2026-08-14: "I'm
# happy to have this run for a few hours overnight and not in a rush." So these
# defaults trade speed for safety on purpose -- a slow scan is an inconvenience,
# a blocked scan is a dead tool.
#
# All of it is enforced in Python, in sources/registry.py. None of it consumes
# Claude tokens: the waiting happens inside the scan process, not in a
# conversation loop.
politeness:
  # Minimum gap between two requests to the SAME host. Enforced across all
  # worker threads, so ~3 requests/second/host at the default. Raise this first
  # if a provider ever starts returning 429s.
  min_seconds_between_requests_per_host: 0.34
  # Threads working across DIFFERENT hosts. Safe to raise, because the per-host
  # limiter above still serialises any single provider.
  max_workers: 8
  # On 429/503/5xx: wait base * 2^attempt, capped, and honour Retry-After when
  # the server sends one. 2s, 4s, 8s, 16s, 32s by default.
  backoff_base_seconds: 2.0
  # Applies to genuine 429s only. Kept well below the old 120s: a single slow
  # host must never be able to stall a whole scan, and anything longer than this
  # is better handled by the next run than by waiting.
  backoff_max_seconds: 30.0
  rate_limit_retries: 3
  # Consecutive timeouts before a host is abandoned for the rest of the run.
  # Slug probing sends nine requests per ATS per company; with the per-host
  # throttle serialising them, one unresponsive provider turns into thirteen
  # minutes of dead waiting per company. Observed with apply.workable.com.
  host_failure_limit: 3
  # How many previously-unknown employers a single broad scan may resolve to a
  # live ATS. Each one costs up to ~45 probe requests, and every company added
  # is swept on every future run -- so this throttles permanent growth of the
  # evaluation queue, not just this run's traffic. Raised 30 -> 60 on
  # 2026-08-14 at Doran's request.
  board_resolve_cap: 60
  # How many Built In job pages one scan may read to learn the employer name.
  # Built In listing pages do not carry the company, so an on-archetype title
  # costs one extra request to identify. Measured 2026-08-25: eight Built In
  # URLs return ~174 on-archetype leads, ~0.85s each including the politeness
  # gap, so 250 is roughly a 3.5-minute ceiling on this stage.
  builtin_detail_cap: 250
  # How many postings one scan may read straight off a board page, for employers
  # with no reachable ATS plus anything over board_resolve_cap. One request each
  # against linkedin.com, the host this whole channel depends on staying friendly.
  board_read_cap: 200

# How the net is cast, and what to distrust once it comes back.
discovery:
  # Boards that run a normal ATS but repost other companies' roles without
  # naming the employer. Structurally they are indistinguishable from a real
  # company -- Jobgether has a genuine Lever board -- so the report needs this
  # list to avoid printing "Jobgether" as though Jobgether were hiring.
  # Seven of the twelve matches in run 14 came through one of these.
  aggregator_slugs:
    - jobgether

  # Named third-party platforms. On a reseller listing that hides the employer,
  # the stack it expects you to work in is the one thing it cannot anonymise --
  # "Salesforce, Seismic, Gong, Snowflake, Slack" alongside "seller feedback" is
  # a sales-tech company. Printed on reseller listings only, and only when three
  # or more appear, because one or two generic tools say nothing.
  stack_tells:
    - Salesforce
    - Seismic
    - Gong
    - Notion
    - Snowflake
    - Slack
    - Marketo
    - HubSpot
    - Pardot
    - Outreach
    - Salesloft
    - Clari
    - 6sense
    - Demandbase
    - Segment
    - Amplitude
    - Mixpanel
    - Looker
    - Tableau
    - dbt
    - Databricks
    - Zapier
    - n8n
    - Workato
    - Airtable
    - Contentful
    - Sanity
    - Webflow
    - Optimizely
    - Braze
    - Iterable
    - Klaviyo
    - Intercom
    - Zendesk
