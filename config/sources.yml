# Where to look. Entries may be listed by name alone -- `verify-sources` resolves
# each one to a live ATS + slug by probing the real APIs, then writes the answer
# back into this file. That way the source map repairs and extends itself instead
# of rotting on hand-guessed slugs.
#
#   status: unresolved | live | dead
#   watch:  true means include in the recurring broad /scan sweep
#
# Slugs are genuinely not guessable: DoorDash is `doordashusa` on Greenhouse,
# not `doordash`. Never hand-edit a slug without verifying it.

ats_endpoints:
  ashby: https://api.ashbyhq.com/posting-api/job-board/{slug}?includeCompensation=true
  greenhouse: https://boards-api.greenhouse.io/v1/boards/{slug}/jobs?content=true
  lever: https://api.lever.co/v0/postings/{slug}?mode=json
  smartrecruiters: https://api.smartrecruiters.com/v1/companies/{slug}/postings?limit=100
  workable: https://apply.workable.com/api/v1/widget/accounts/{slug}?details=true
ats_probe_order:
- greenhouse
- ashby
- lever
- smartrecruiters
- workable
