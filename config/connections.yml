# Companies where Doran has a personal connection - a friend, a former
# colleague, or a LinkedIn relationship warm enough to ask for a referral.
#
# Two things happen to every company listed here:
#   1. It is force-included in the broad sweep. `python cli.py sync-connections`
#      resolves its ATS board and marks it watched in sources.yml, so a
#      connection company can never quietly fall out of the scan.
#   2. Every posting from it gets a flat score bump (below), hard-capped at 5.0,
#      and is flagged in the report so the reason for the ranking is visible.
#
# Only `name` is required. `ats` and `slug` are filled in by sync-connections.
# `aliases` matters when the ATS company name differs from the common name
# (Meta posts as "Facebook" on some boards). `contact` is free text for Doran's
# own reference and is never used by the code.

bump: 1.0
max_score: 5.0
companies:
